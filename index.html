<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Pelihuone - Juhanin Backlog & Tierlist</title>
<!-- Include Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Base CSS Link -->
<link rel="stylesheet" href="base.css">

<style>
:root {
    --bg: #020408;
    --panel: #070d19;
    --text: #cfcfcf;
    --accent-horror: #ff7518;
    --accent-adventure: #9d4edd;
    --accent-other: #00b4d8;
    
    /* Tier Colors */
    --tier-s: #ff7f7f;
    --tier-a: #ffbf7f;
    --tier-b: #ffff7f;
    --tier-c: #7fff7f;
    --tier-d: #7f7fff;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at center, #050b14 0%, #010307 100%);
    min-height: 100vh;
    box-sizing: border-box;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.9));
    pointer-events: none;
}

.main-header {
    text-align: center;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 117, 24, 0.4);
    margin-bottom: 25px;
    position: relative;
    z-index: 10;
}

/* 3-Panel Layout Container */
.catalog-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1600px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
}

@media (max-width: 1200px) {
    .catalog-grid {
        grid-template-columns: 1fr;
    }
}

/* Individual Scrollable Hub Panel */
.hub-panel {
    background: linear-gradient(145deg, var(--panel), #03060c);
    border: 1px solid #112244;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
    /* Custom Scrollbar for Webkit */
    scrollbar-width: thin;
    scrollbar-color: #223355 #03060c;
}

.hub-panel::-webkit-scrollbar {
    width: 8px;
}
.hub-panel::-webkit-scrollbar-track {
    background: #03060c;
    border-radius: 4px;
}
.hub-panel::-webkit-scrollbar-thumb {
    background: #223355;
    border-radius: 4px;
}
.hub-panel::-webkit-scrollbar-thumb:hover {
    background: #334466;
}

.hub-title {
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: bold;
    margin-bottom: 20px;
    padding-bottom: 8px;
    text-transform: uppercase;
    position: sticky;
    top: -20px;
    background: var(--panel);
    z-index: 5;
    padding-top: 10px;
}

.hub-title.horror {
    color: var(--accent-horror);
    border-bottom: 2px solid var(--accent-horror);
    text-shadow: 0 0 10px rgba(255, 117, 24, 0.4);
}

.hub-title.adventure {
    color: var(--accent-adventure);
    border-bottom: 2px solid var(--accent-adventure);
    text-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
}

.hub-title.other {
    color: var(--accent-other);
    border-bottom: 2px solid var(--accent-other);
    text-shadow: 0 0 10px rgba(0, 180, 216, 0.4);
}

.category-block {
    margin-bottom: 25px;
    padding-bottom: 15px;
}

.category-title {
    font-size: 16px;
    letter-spacing: 1px;
    color: #a89cc2;
    border-bottom: 1px dashed #112244;
    padding-bottom: 4px;
    margin-bottom: 12px;
    text-transform: uppercase;
}

.covers-row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    overflow-x: auto;
}

.cover-img {
    width: 90px;
    height: 125px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #223355;
    background: #020408;
    flex-shrink: 0;
}

.game-card {
    margin-top: 10px;
    padding: 12px;
    border-radius: 8px;
    background: linear-gradient(145deg, #050a12, #020408);
    border: 1px solid #101c33;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.game-name {
    font-weight: bold;
    color: #ffffff;
}

.store-link {
    font-size: 12px;
    color: #4a90e2;
    text-decoration: none;
    margin-left: 8px;
}

.store-link:hover {
    text-decoration: underline;
}

.review-content {
    display: none;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #112244;
}

.tier-badge {
    display: inline-block;
    padding: 2px 6px;
    font-weight: bold;
    border-radius: 4px;
    color: #000;
    margin-left: 5px;
}

.jumpscare-badge {
    display: inline-block;
    font-size: 11px;
    color: #ff5555;
    background: rgba(255, 85, 85, 0.15);
    border: 1px solid rgba(255, 85, 85, 0.4);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
}

.no-review {
    font-size: 12px;
    color: #556677;
    font-style: italic;
}

.review-meta-info {
    display: flex;
    gap: 15px;
    font-size: 12px;
    color: #8fa0bc;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #112244;
}
</style>

const supabaseUrl = 'https://suahnxysnelbhdkogpro.supabase.co';
const supabaseKey = 'sb_publishable_tVlPbeAMSMnxG36oFU7ZJw_R4XOwAJZ';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

function toggleReview(id) {
    const el = document.getElementById("review-" + id);
    if (el) el.style.display = el.style.display === "block" ? "none" : "block";
}

async function renderApp() {
    const container = document.getElementById("catalog-container");

    // Fetch reviews from Supabase
    let { data: reviews } = await _supabase.from('reviews').select('*');
    
    // Create quick lookup map for reviews by game title
    const reviewMap = {};
    if (reviews) {
        reviews.forEach(r => {
            if (r.title) {
                reviewMap[r.title.toLowerCase().trim()] = r;
            }
        });
    }

    // --- Dynamic Routing for Custom / Unlisted Reviews into "📦 Muut" ---
    if (reviews) {
        // Collect all game names listed hardcoded in hubData
        const knownTitles = new Set();
        hubData.forEach(hub => {
            hub.categories.forEach(cat => {
                cat.games.forEach(g => knownTitles.add(g.name.toLowerCase().trim()));
            });
        });

        // Find reviews from Supabase that are NOT hardcoded in hubData
        const unlistedReviews = reviews.filter(r => r.title && !knownTitles.has(r.title.toLowerCase().trim()));

        // If there are unlisted reviews, append them to the "Muut" panel
        if (unlistedReviews.length > 0) {
            const muutHub = hubData.find(h => h.hubClass === "other");
            if (muutHub) {
                let unlistedCat = muutHub.categories.find(c => c.category === "MUUT ARVOSTELUT");
                if (!unlistedCat) {
                    unlistedCat = { category: "MUUT ARVOSTELUT", covers: [], games: [] };
                    muutHub.categories.push(unlistedCat);
                }
                
                unlistedReviews.forEach(r => {
                    if (!unlistedCat.games.some(g => g.name.toLowerCase().trim() === r.title.toLowerCase().trim())) {
                        unlistedCat.games.push({
                            name: r.title,
                            appId: r.app_id || "",
                            psUrl: r.ps_url || ""
                        });
                    }
                });
            }
        }
    }

    let html = "";

    hubData.forEach((hub, hubIdx) => {
        // Open Dedicated Scrollable Panel
        html += `<div class="hub-panel">`;
        html += `<div class="hub-title ${hub.hubClass}">${hub.hubName}</div>`;

        if (hub.categories.length === 0) {
            html += `<p class="no-review" style="padding-top: 10px;">Ei muita arvosteluja vielä.</p>`;
        }

        hub.categories.forEach((cat, catIdx) => {
            html += `<div class="category-block">`;
            html += `<div class="category-title">${cat.category}</div>`;
            
            // Render Covers Row if present
            if (cat.covers && cat.covers.length > 0) {
                html += `<div class="covers-row">`;
                cat.covers.forEach(c => {
                    html += `<img src="${c}" class="cover-img" alt="Cover" onerror="this.style.display='none'">`;
                });
                html += `</div>`;
            }

            // Render Games
            cat.games.forEach((game, gameIdx) => {
                const gameId = `g_${hubIdx}_${catIdx}_${gameIdx}`;
                
                // Build Store Link
                let storeUrl = "";
                if (game.appId) storeUrl = `https://store.steampowered.com/app/${game.appId}`;
                else if (game.psUrl) storeUrl = game.psUrl;

                // Check if game has review in Supabase
                const matchedReview = reviewMap[game.name.toLowerCase().trim()];

                html += `
                <div class="game-card">
                    <div class="game-header" onclick="toggleReview('${gameId}')">
                        <div>
                            <span class="game-name">${game.name}</span>
                            ${storeUrl ? `<a href="${storeUrl}" target="_blank" class="store-link" onclick="event.stopPropagation()">Store ↗</a>` : ''}
                        </div>
                        <div>
                            ${matchedReview ? `<span style="color:#ff7518; font-size:12px;">★ Review</span>` : `<span class="no-review">Unreviewed</span>`}
                        </div>
                    </div>
                    <div class="review-content" id="review-${gameId}">`;

                if (matchedReview) {
                    let metaHTML = "";
                    if (matchedReview.playtime || matchedReview.date_finished) {
                        metaHTML += `<div class="review-meta-info">`;
                        if (matchedReview.playtime) metaHTML += `<span>⏱️ <strong>Playtime:</strong> ${matchedReview.playtime}</span>`;
                        if (matchedReview.date_finished) metaHTML += `<span>📅 <strong>Finished:</strong> ${matchedReview.date_finished}</span>`;
                        metaHTML += `</div>`;
                    }

                    html += metaHTML;

                    if (matchedReview.aspects) {
                        for (let aspect in matchedReview.aspects) {
                            const item = matchedReview.aspects[aspect];
                            const tierLetter = (item.tier || 'C').toUpperCase();
                            
                            let jumpscareHTML = "";
                            if (item.jumpscares && item.jumpscares !== "0") {
                                jumpscareHTML = `<span class="jumpscare-badge">👻 ${item.jumpscares} Jumpscares</span>`;
                            }

                            html += `
                            <div style="margin-bottom: 8px;">
                                <strong style="color: #ff7518;">${aspect}:</strong> 
                                <span class="tier-badge" style="background-color: var(--tier-${tierLetter.toLowerCase()}, #fff);">${tierLetter}</span>
                                ${jumpscareHTML}<br>
                                <small style="color:#aaa;">${item.text || ''}</small>
                            </div>`;
                        }
                    }
                } else {
                    html += `<p class="no-review">This game is in your backlog/wishlist and hasn't been reviewed yet.</p>`;
                }

                html += `
                    </div>
                </div>`;
            });

            html += `</div>`;
        });

        // Close Panel
        html += `</div>`;
    });

    container.innerHTML = html;
}

renderApp();
</script>
