<style>
:root {
    --bg: #020408;
    --panel: #070d19;
    --text: #cfcfcf;
    --accent: #ff7518;
    
    /* Tier Colors */
    --tier-s: #ff7f7f;
    --tier-a: #ffbf7f;
    --tier-b: #ffff7f;
    --tier-c: #7fff7f;
    --tier-d: #7f7fff;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at center, #050b14 0%, #010307 100%);
    overflow-x: hidden;
}

.container {
    max-width: 760px;
    margin: 40px auto;
    padding: 25px;
    background: linear-gradient(145deg, var(--panel), #03060c);
    border: 1px solid #112244;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
}

h1 {
    text-align: center;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(255, 117, 24, 0.5);
    margin-bottom: 30px;
}

.category-block {
    margin-bottom: 40px;
    border-bottom: 1px solid #112244;
    padding-bottom: 20px;
}

.category-title {
    font-size: 20px;
    letter-spacing: 1.5px;
    color: #ff7518;
    border-bottom: 2px solid #ff7518;
    padding-bottom: 6px;
    margin-bottom: 15px;
    text-transform: uppercase;
}

.covers-row {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
}

.cover-img {
    width: 100px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #223355;
    background: #020408;
}

.game-card {
    margin-top: 10px;
    padding: 12px;
    border-radius: 8px;
    background: linear-gradient(145deg, #050a12, #020408);
    border: 1px solid #101c33;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.game-name {
    font-weight: bold;
    color: #ffffff;
}

.store-link {
    font-size: 12px;
    color: #4a90e2;
    text-decoration: none;
    margin-left: 10px;
}

.store-link:hover {
    text-decoration: underline;
}

.review-content {
    display: none;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #112244;
}

.tier-badge {
    display: inline-block;
    padding: 2px 6px;
    font-weight: bold;
    border-radius: 4px;
    color: #000;
    margin-left: 5px;
}

.jumpscare-badge {
    display: inline-block;
    font-size: 11px;
    color: #ff5555;
    background: rgba(255, 85, 85, 0.15);
    border: 1px solid rgba(255, 85, 85, 0.4);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
}

.no-review {
    font-size: 12px;
    color: #556677;
    font-style: italic;
}
</style>

// Initialize Supabase Connection
const supabaseUrl = 'https://suahnxysnelbhdkogpro.supabase.co';
const supabaseKey = 'sb_publishable_tVlPbeAMSMnxG36oFU7ZJw_R4XOwAJZ';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

function toggleReview(id) {
    const el = document.getElementById("review-" + id);
    if (el) el.style.display = el.style.display === "block" ? "none" : "block";
}

async function renderApp() {
    const container = document.getElementById("catalog-container");

    // Fetch reviews from Supabase
    let { data: reviews } = await _supabase.from('reviews').select('*');
    
    // Create quick lookup map for reviews by game title
    const reviewMap = {};
    if (reviews) {
        reviews.forEach(r => {
            reviewMap[r.title.toLowerCase().trim()] = r;
        });
    }

    let html = "";

    genreData.forEach((cat, catIdx) => {
        html += `<div class="category-block">`;
        html += `<div class="category-title">${cat.category}</div>`;
        
        // Render Covers Row
        if (cat.covers && cat.covers.length > 0) {
            html += `<div class="covers-row">`;
            cat.covers.forEach(c => {
                html += `<img src="${c}" class="cover-img" alt="Cover" onerror="this.style.display='none'">`;
            });
            html += `</div>`;
        }

        // Render Games
        cat.games.forEach((game, gameIdx) => {
            const gameId = `g_${catIdx}_${gameIdx}`;
            
            // Build Store Link
            let storeUrl = "";
            if (game.appId) storeUrl = `https://store.steampowered.com/app/${game.appId}`;
            else if (game.psUrl) storeUrl = game.psUrl;

            // Check if game has review in Supabase
            const matchedReview = reviewMap[game.name.toLowerCase().trim()];

            html += `
            <div class="game-card">
                <div class="game-header" onclick="toggleReview('${gameId}')">
                    <div>
                        <span class="game-name">${game.name}</span>
                        ${storeUrl ? `<a href="${storeUrl}" target="_blank" class="store-link" onclick="event.stopPropagation()"> Store ↗</a>` : ''}
                    </div>
                    <div>
                        ${matchedReview ? `<span style="color:#ff7518;">★ Review Available</span>` : `<span class="no-review">Unreviewed</span>`}
                    </div>
                </div>
                <div class="review-content" id="review-${gameId}">`;

            if (matchedReview) {
                // Render review contents
                for (let aspect in matchedReview.aspects) {
                    const item = matchedReview.aspects[aspect];
                    const tierLetter = (item.tier || 'C').toUpperCase();
                    
                    let jumpscareHTML = "";
                    if (item.jumpscares) {
                        jumpscareHTML = `<span class="jumpscare-badge">👻 ${item.jumpscares} Jumpscares</span>`;
                    }

                    html += `
                    <div style="margin-bottom: 8px;">
                        <strong style="color: var(--accent);">${aspect}:</strong> 
                        <span class="tier-badge" style="background-color: var(--tier-${tierLetter.toLowerCase()}, #fff);">${tierLetter}</span>
                        ${jumpscareHTML}<br>
                        <small style="color:#aaa;">${item.text || ''}</small>
                    </div>`;
                }
            } else {
                html += `<p class="no-review">This game is in your backlog/wishlist and hasn't been reviewed yet.</p>`;
            }

            html += `
                </div>
            </div>`;
        });

        html += `</div>`;
    });

    container.innerHTML = html;
}

renderApp();
