<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Pelihuone Admin Panel</title>
<!-- Include Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #030303;
    --panel: #0a0a0a;
    --text: #cfcfcf;
    --accent: #ff7518;
    --danger: #ff1a1a;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at center, #080808 0%, #000 100%);
    overflow-x: hidden;
}

.container {
    max-width: 620px;
    margin: 40px auto;
    padding: 25px;
    background: linear-gradient(145deg, #0a0a0a, #050505);
    border: 1px solid #222;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
}

h1, h3 {
    letter-spacing: 2px;
    color: #e0e0e0;
}

button {
    padding: 10px 16px;
    margin: 10px 0;
    background: linear-gradient(145deg, #111, #0a0a0a);
    border: 1px solid #333;
    color: var(--text);
    cursor: pointer;
    transition: 0.2s;
    width: 100%;
    font-size: 14px;
    font-weight: bold;
}

button:hover {
    color: var(--accent);
    border-color: var(--accent);
}

.btn-danger {
    width: auto;
    padding: 6px 12px;
    margin: 0;
}

.btn-danger:hover {
    color: var(--danger);
    border-color: var(--danger);
}

input, textarea, select {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    background: #0b0b0b;
    border: 1px solid #222;
    color: var(--text);
    box-sizing: border-box;
    border-radius: 4px;
}

input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    outline: none;
}

textarea {
    height: 50px;
    resize: vertical;
}

.review-item {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #050505;
    border: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.meta-group {
    display: flex;
    gap: 10px;
    margin: 6px 0;
}
.meta-group div {
    flex: 1;
}

.quick-tags {
    display: flex;
    gap: 5px;
    margin-top: 2px;
    flex-wrap: wrap;
}
.tag {
    font-size: 11px;
    background: #141414;
    border: 1px solid #252525;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    color: #888;
}
.tag:hover {
    color: #fff;
    border-color: #555;
}

.admin-meta-badge {
    font-size: 11px;
    color: #888;
    background: #111;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 5px;
    border: 1px solid #222;
}

.jumpscare-container {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 15px;
    font-size: 13px;
}
.jumpscare-container input {
    width: 70px;
    padding: 4px;
    margin: 0;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h1>Tierlist Admin Management</h1>
    
    <label>Admin Password:</label>
    <input type="password" id="adminPassword" placeholder="Enter password to make changes">
    <hr style="border-color:#222; margin: 20px 0;">
    
    <h3>Add / Update Game Review</h3>
    
    <label>Select Game from Catalog:</label>
    <select id="gameSelect" onchange="handleGameSelectChange()">
        <!-- Populated dynamically -->
    </select>

    <div id="customTitleContainer" style="display: none;">
        <label>Custom Game Title (Muut Panel):</label>
        <input id="customTitle" placeholder="Enter custom game name">
    </div>

    <div class="meta-group">
        <div>
            <label style="font-size: 13px;">Playtime:</label>
            <input type="text" id="playtime" placeholder="e.g., 8 hours, 12h 30m">
            <div class="quick-tags">
                <span class="tag" onclick="setPlaytime('Short (< 5h)')">Short</span>
                <span class="tag" onclick="setPlaytime('10-20 hours')">10-20h</span>
                <span class="tag" onclick="setPlaytime('50+ hours')">50h+</span>
            </div>
        </div>
        <div>
            <label style="font-size: 13px;">Date Finished:</label>
            <input type="date" id="dateFinished">
            <div class="quick-tags">
                <span class="tag" onclick="setTodayDate()">📅 Set to Today</span>
            </div>
        </div>
    </div>
    
    <div id="aspects" style="margin-top: 15px;"></div>
    
    <button onclick="addReview()">Save Review to Cloud</button>
    
    <hr style="border-color:#222; margin: 20px 0;">
    <h3>Published Reviews</h3>
    <div id="reviews">Loading reviews...</div>
</div>

<script>
const hubData = [

          { name: "Unholy" }, { name: "The Nightfall" }, { name: "Ikai" }, { name: "Lonely Hospital" },

          { name: "Someday You'll Return" }, { name: "Ad Infinitum" }, { name: "Case Records: Fear Of Abduction" },
          { name: "Blair Witch" }, { name: "Madison" }, { name: "The Medium" }, { name: "Visage" },
          { name: "The Renovator: Origins" }, { name: "Who's At The Door?" }, { name: "There's A Gun In The Office" },
          { name: "Devil Inside Us: Roots Of Evil" }, { name: "Don't Knock Twice" }, { name: "Beyond Hanwell" },

          { name: "The Chant" }, { name: "Labyrinthine" }, { name: "Amber Alert" }, { name: "Caretaker" },

          { name: "Remothered: Broken Porcelain" }, { name: "The Tag-Along Obsession" }, { name: "Cruelty" },

    hubType: "other",
    isMuutHub: true,
    categories: [

        games: [

        ]
      }
    ]

// Defined Aspects per Genre Type
const aspectPresets = {
    horror: ["Gameplay", "Story", "Atmosphere", "Sound Design", "Pacing", "Scare Factor"],
    adventure: ["Gameplay", "Story", "Atmosphere", "Sound Design", "Pacing", "Puzzles", "Open World"],
    other: ["Gameplay", "Story", "Atmosphere", "Sound Design", "Pacing"]
};

let currentAspects = aspectPresets.horror;

// Initialize Supabase Connection
const supabaseUrl = 'https://suahnxysnelbhdkogpro.supabase.co';
const supabaseKey = 'sb_publishable_tVlPbeAMSMnxG36oFU7ZJw_R4XOwAJZ';
const SECRET_PASSWORD = 'Nalle2017jjv';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

function populateGameSelect() {
    const select = document.getElementById("gameSelect");
    select.innerHTML = "";

    hubData.forEach(hub => {
        hub.categories.forEach(cat => {
            const group = document.createElement("optgroup");
            group.label = `${hub.hubName} — ${cat.category}`;
            cat.games.forEach(game => {
                const opt = document.createElement("option");
                opt.value = game.name;
                opt.textContent = game.displayName || game.name;
                opt.dataset.hubType = hub.hubType;
                if (hub.isMuutHub) {
                    opt.dataset.isMuut = "true";
                }
                group.appendChild(opt);
            });
            select.appendChild(group);
        });
    });
}

function handleGameSelectChange() {
    const select = document.getElementById("gameSelect");
    const container = document.getElementById("customTitleContainer");
    const selectedOption = select.options[select.selectedIndex];
    
    // Toggle custom game input panel
    if (selectedOption.dataset.isMuut === "true" || select.value === "__custom__") {
        container.style.display = "block";
    } else {
        container.style.display = "none";
    }

    // Switch active review aspects dynamically based on Genre Hub
    const hubType = selectedOption.dataset.hubType || "horror";
    currentAspects = aspectPresets[hubType] || aspectPresets.other;
    
    loadAspects();
}

function loadAspects() {
    const container = document.getElementById("aspects");
    container.innerHTML = "";
    
    currentAspects.forEach(a => {
        let jumpscareHTML = "";
        if (a === "Scare Factor") {
            jumpscareHTML = `
            <span class="jumpscare-container">
                <label>👻 Jumpscares:</label>
                <input type="text" id="jumpscare-count" placeholder="e.g. 5, None">
            </span>`;
        }

        container.innerHTML += `
        <div style="margin-bottom:12px;">
            <strong>${a}</strong>
            <select id="${a}">
                <option>S</option>
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
            </select>
            ${jumpscareHTML}
            <textarea id="${a}-text" placeholder="Comment for ${a}..."></textarea>
        </div>`;
    });
}

function setPlaytime(val) {
    document.getElementById("playtime").value = val;
}

function setTodayDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("dateFinished").value = today;
}

function checkAuth() {
    const enteredPassword = document.getElementById("adminPassword").value;
    if (enteredPassword !== SECRET_PASSWORD) {
        alert("Invalid Admin Password!");
        return false;
    }
    return true;
}

async function addReview() {
    if (!checkAuth()) return;

    const select = document.getElementById("gameSelect");
    let title = select.value;
    if (title === "__custom__" || select.options[select.selectedIndex].dataset.isMuut === "true") {
        title = document.getElementById("customTitle").value;
    }

    const playtime = document.getElementById("playtime").value;
    const dateFinished = document.getElementById("dateFinished").value;

    if (!title || title.trim() === "") return alert("Please select or type a game title");

    let aspectsData = {};
    currentAspects.forEach(a => {
        const selectEl = document.getElementById(a);
        const textEl = document.getElementById(a + "-text");

        if (selectEl && textEl) {
            aspectsData[a] = {
                tier: selectEl.value,
                text: textEl.value
            };
            if (a === "Scare Factor" && document.getElementById("jumpscare-count")) {
                aspectsData[a].jumpscares = document.getElementById("jumpscare-count").value || "0";
            }
        }
    });

    const cleanTitle = title.trim();

    // Check if review already exists
    const { data: existing } = await _supabase
        .from('reviews')
        .select('id')
        .eq('title', cleanTitle)
        .maybeSingle();

    let result;
    if (existing) {
        // Update existing record
        result = await _supabase
            .from('reviews')
            .update({
                playtime: playtime || null,
                date_finished: dateFinished || null,
                aspects: aspectsData
            })
            .eq('id', existing.id);
    } else {
        // Insert new record
        result = await _supabase
            .from('reviews')
            .insert([{
                title: cleanTitle,
                playtime: playtime || null,
                date_finished: dateFinished || null,
                aspects: aspectsData
            }]);
    }

    if (result.error) {
        alert("Error saving: " + result.error.message);
    } else {
        alert(`Review for "${cleanTitle}" saved successfully!`);
        document.getElementById("playtime").value = "";
        document.getElementById("dateFinished").value = "";
        document.getElementById("customTitle").value = "";
        loadAspects();
        renderReviews();
    }
}

async function deleteReview(id) {
    if (!checkAuth()) return;
    if (!confirm("Delete this review permanently?")) return;

    const { error } = await _supabase.from('reviews').delete().eq('id', id);
    if (error) alert("Error deleting review");
    else renderReviews();
}

async function renderReviews() {
    const container = document.getElementById("reviews");
    let { data: reviews } = await _supabase.from('reviews').select('*').order('created_at', { ascending: false });

    container.innerHTML = "";
    if (!reviews || reviews.length === 0) {
        container.innerHTML = "<p style='color:#666;'>No published reviews found.</p>";
        return;
    }

    reviews.forEach(r => {
        let metaBadges = "";
        if (r.playtime) metaBadges += `<span class="admin-meta-badge">⏱️ ${r.playtime}</span>`;
        if (r.date_finished) metaBadges += `<span class="admin-meta-badge">📅 ${r.date_finished}</span>`;

        container.innerHTML += `
        <div class="review-item">
            <div>
                <strong style="color: #ff7518;">${r.title}</strong>
                <div style="margin-top: 4px;">${metaBadges}</div>
            </div>
            <button class="btn-danger" onclick="deleteReview(${r.id})">Delete</button>
        </div>`;
    });
}

// Initial Setup
populateGameSelect();
handleGameSelectChange();
renderReviews();
</script>

</body>
</html>
